name: Deploy rooms to staging

# Started by hand only. The "staging" environment holds the deploy settings and
# requires the owner's approval before the job can run.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run only (nothing is deployed)
        type: boolean
        default: true

permissions:
  contents: read
  # Lets the job exchange GitHub's short-lived token for Google credentials.
  id-token: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Rooms to whatdoyouwant-staging
    if: github.ref == 'refs/heads/codex/v2-launch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            rooms/package-lock.json

      # The deploy script runs the room emulator tests first; Firestore needs a JDK.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Restore tools
        run: npm ci --no-audit --no-fund

      # Workload Identity Federation: no service account key is stored anywhere.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Deploy (or dry run)
        run: >-
          npm run deploy:staging -- --confirm whatdoyouwant-staging
          ${{ inputs.dry_run && '--dry-run' || '' }}
