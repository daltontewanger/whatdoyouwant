name: Checks

on:
  pull_request:
    branches: [main, codex/v2-launch]
  push:
    branches: [codex/v2-launch]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter format, analyze, test and web build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # Keep in step with the version used locally so format and analyze agree.
          flutter-version: 3.32.4
          channel: stable
          cache: true

      - name: Restore packages from the lockfile
        run: flutter pub get --enforce-lockfile

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --no-pub lib test

      - name: Test
        run: flutter test --no-pub

      - name: Build production web
        run: flutter build web --release --no-pub

  node:
    name: Config preflight and emulator suites
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Matches the runtime declared for Cloud Functions.
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      # The Firestore emulator needs a JDK.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Check environment configuration
        run: node scripts/check-environments.mjs

      - name: Restore tools and Functions dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix functions --no-audit --no-fund

      - name: Tooling compatibility tests
        run: npm run test:tooling

      - name: Baseline emulator tests
        run: npm run test:local

      - name: Candidate rules and callable endpoint tests
        run: npm run test:policy
